services:
  - type: web
    name: landlens-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false # set to postgres on Render (e.g. from Render Postgres) or leave empty for SQLite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:3000
      - key: VLM_PROVIDER
        value: gemini
      - key: VLM_API_KEY
        sync: false
      - key: VLM_MODEL
        value: gemini-3.5-flash
      - key: ENABLE_VLM
        value: true
      - key: CONF_THRESHOLD
        value: 0.90
      - key: MAX_UPLOAD_MB
        value: 15
