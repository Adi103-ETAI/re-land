# ── LANDLENS — full stack ───────────────────────────────────────────────
# Default (zero external services, SQLite inside the backend container):
#   docker compose up --build
# Full profile (adds PostGIS + Redis):
#   docker compose --profile full up --build
#   → then set DATABASE_URL=postgresql+asyncpg://landlens:secret@db:5432/landlens in backend/.env

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # SQLite inside the container unless DATABASE_URL is provided via .env
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - landlens_backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Empty = same-origin proxy (browser never calls the backend directly).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ── Optional infra (--profile full) ───────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    profiles: ["full"]
    volumes:
      - landlens_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: landlens
      POSTGRES_USER: landlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landlens -d landlens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    volumes:
      - landlens_cache:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  landlens_backend_data:
  landlens_pgdata:
  landlens_cache:
